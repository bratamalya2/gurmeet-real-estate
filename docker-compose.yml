services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    command:
      - bash
      - -c
      - |
        mongosh --host mongo --quiet --eval 'try { rs.status(); } catch (error) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] }); }'
        until mongosh --host mongo --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; do sleep 1; done

  api:
    build: ./apps/api
    env_file: ./apps/api/.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./apps/api/uploads:/app/uploads
      - ./data:/app/data:ro
    depends_on:
      mongo-init:
        condition: service_completed_successfully

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: https://portal.homesbygurmeet.com/api
        NEXT_PUBLIC_SITE_URL: https://homesbygurmeet.com
        NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_KEY:-AIzaSyBm7oFRuX7MhliMJxvvBa9F6m7xHfBgX3Q}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-0x4AAAAAAEmJDsx6JivBbJ-w}
        NEXT_PUBLIC_AGENT_PHONE: ${NEXT_PUBLIC_AGENT_PHONE:-+1510-209-7718}
        NEXT_PUBLIC_AGENT_EMAIL: ${NEXT_PUBLIC_AGENT_EMAIL:-gurmeet.realty1@gmail.com}
        NEXT_PUBLIC_AGENT_ADDRESS: ${NEXT_PUBLIC_AGENT_ADDRESS:-Fremont, California}
        NEXT_PUBLIC_BRAND_OWNER: ${NEXT_PUBLIC_BRAND_OWNER:-Gurmeet}
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-Homes By Gurmeet}
        NEXT_PUBLIC_FACEBOOK_URL: ${NEXT_PUBLIC_FACEBOOK_URL:-https://www.facebook.com/510gurmeetsingh/}
        NEXT_PUBLIC_INSTAGRAM_URL: ${NEXT_PUBLIC_INSTAGRAM_URL:-https://www.instagram.com/homesbygurmeetsingh}
        NEXT_PUBLIC_LINKEDIN_URL: ${NEXT_PUBLIC_LINKEDIN_URL:-https://www.linkedin.com/in/gurmeet-singh-2a846941}
        NEXT_PUBLIC_BRAND_LOGO: ${NEXT_PUBLIC_BRAND_LOGO:-/Homes BY Gurmeet Logo.png}
    env_file: ./apps/web/.env
    environment:
      API_INTERNAL_URL: http://api:4000/api
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  mongo_data:
